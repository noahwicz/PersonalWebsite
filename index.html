
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f4f0" />
  <meta name="description" content="Noah Jaskiewicz — Software Engineer at Google." />
  <title>Noah Jaskiewicz</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <style>
    :root {
      --background: #f5f4f0;
      --text: #181818;
      --muted: #65645f;
      --faint: #96958e;
      --line: #d4d2ca;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--background);
      color: var(--text);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
    }

    a:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 6px;
    }

    .page {
      width: min(100% - 96px, 1120px);
      min-height: 100svh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    /* Header */

    .masthead {
      padding-top: 39px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .monogram {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.055em;
      text-decoration: none;
    }

    .location {
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.095em;
    }

    /* Main content */

    main {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 100px 0 105px;
    }

    .intro h1 {
      margin: 0;
      font-size: clamp(58px, 8.4vw, 122px);
      font-weight: 500;
      letter-spacing: -0.078em;
      line-height: 0.98;
    }

    .role {
      margin: 28px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 1.7vw, 21px);
      font-weight: 400;
      letter-spacing: -0.025em;
      line-height: 1.5;
    }

    /* Google colors */

    .google {
      display: inline-block;
      white-space: nowrap;
      font-weight: 500;
    }

    .blue {
      color: #4285f4;
    }

    .red {
      color: #ea4335;
    }

    .yellow {
      color: #fbbc05;
    }

    .green {
      color: #34a853;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Information rows */

    .details {
      width: 100%;
      margin-top: clamp(82px, 12vh, 146px);
      border-top: 1px solid var(--line);
    }

    .detail-row {
      display: grid;
      grid-template-columns: minmax(160px, 1fr) minmax(0, 1fr);
      align-items: center;
      min-height: 75px;
      gap: 24px;
      border-bottom: 1px solid var(--line);
    }

    .detail-label,
    .detail-value {
      font-size: 15px;
      line-height: 1.5;
      letter-spacing: -0.015em;
    }

    .detail-label {
      font-weight: 500;
    }

    .detail-value {
      color: var(--muted);
      transition: transform 240ms cubic-bezier(.2, .7, .2, 1);
    }

    .detail-row:hover .detail-value {
      transform: translateX(5px);
    }

    .divider-symbol {
      margin: 0 7px;
      color: var(--faint);
    }

    /* External links */

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 9px 28px;
    }

    .links a {
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
      text-decoration: none;
      text-underline-offset: 5px;
      transition: color 180ms ease;
    }

    .links a:hover {
      color: var(--text);
      text-decoration: underline;
    }

    .links .arrow {
      display: inline-block;
      font-size: 13px;
      transition: transform 180ms ease;
    }

    .links a:hover .arrow {
      transform: translate(2px, -2px);
    }

    /* Footer */

    footer {
      padding: 0 0 33px;
      color: var(--faint);
      font-size: 11px;
      letter-spacing: 0.015em;
    }

    /* Subtle entrance animations */

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .masthead {
      animation: enter 650ms both;
    }

    .intro {
      animation: enter 750ms 80ms both;
    }

    .details {
      animation: enter 750ms 180ms both;
    }

    footer {
      animation: enter 650ms 260ms both;
    }

    /* Mobile layout */

    @media (max-width: 700px) {
      .page {
        width: calc(100% - 44px);
      }

      .masthead {
        padding-top: 27px;
      }

      .location {
        font-size: 10px;
      }

      main {
        justify-content: flex-start;
        padding: 150px 0 85px;
      }

      .intro h1 {
        font-size: clamp(51px, 11.8vw, 84px);
        letter-spacing: -0.075em;
        max-width: 650px;
      }

      .role {
        margin-top: 23px;
        font-size: 17px;
      }

      .details {
        margin-top: 92px;
      }

      .detail-row {
        grid-template-columns: minmax(80px, 0.7fr) minmax(0, 1.3fr);
        min-height: 70px;
        gap: 14px;
      }

      .detail-label,
      .detail-value {
        font-size: 14px;
      }

      .links {
        gap: 8px 17px;
      }

      footer {
        padding-bottom: 25px;
      }
    }

    @media (max-width: 380px) {
      main {
        padding-top: 115px;
      }

      .intro h1 {
        font-size: 49px;
      }

      .detail-row {
        grid-template-columns: 90px minmax(0, 1fr);
      }
    }

    /* Respect accessibility motion preferences */

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- Header -->
    <header class="masthead">
      <a class="monogram" href="/" aria-label="Noah Jaskiewicz, home">
        NJ
      </a>

      <span class="location">SAN FRANCISCO, CA</span>
    </header>

    <!-- Main content -->
    <main id="main">

      <!-- Name and role -->
      <section class="intro" aria-labelledby="name">
        <h1 id="name">Noah Jaskiewicz</h1>

        <p class="role">
          Software Engineer at
          <span class="google">
            <span class="sr-only">Google</span><span aria-hidden="true" class="blue">G</span><span aria-hidden="true" class="red">o</span><span aria-hidden="true" class="yellow">o</span><span aria-hidden="true" class="blue">g</span><span aria-hidden="true" class="green">l</span><span aria-hidden="true" class="red">e</span>
          </span>.
        </p>
      </section>

      <!-- Information -->
      <section class="details" aria-label="Work and links">

        <div class="detail-row">
          <span class="detail-label">Work</span>
          <span class="detail-value">
            01 <span class="divider-symbol">—</span> Google
          </span>
        </div>

        <div class="detail-row">
          <span class="detail-label">Previously</span>
          <span class="detail-value">
            Stripe <span class="divider-symbol">·</span> Amazon
          </span>
        </div>

        <div class="detail-row">
          <span class="detail-label">Elsewhere</span>

          <span class="detail-value links">
            <a
              href="https://github.com/noahwicz"
              target="_blank"
              rel="noopener noreferrer"
            >
              GitHub <span class="arrow" aria-hidden="true">↗</span>
            </a>

            <a
              href="https://www.linkedin.com/in/noahjaskiewicz"
              target="_blank"
              rel="noopener noreferrer"
            >
              LinkedIn <span class="arrow" aria-hidden="true">↗</span>
            </a>
          </span>
        </div>

      </section>

    </main>

    <!-- Footer -->
    <footer>
      © 2026 NOAH JASKIEWICZ
    </footer>

  </div>
</body>
</html>
